[package]
name = "wallflow"
version = "1.0.0"
edition = "2021"
description = "macOS wallpaper rotator driven by a config file"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
